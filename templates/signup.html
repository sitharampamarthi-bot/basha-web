<!DOCTYPE html>
<html>
<head>
    <title>Basha Signup</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#6f42c1">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<div class="container d-flex justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card shadow p-4" style="max-width:500px;width:100%;border-radius:25px;">

        <h2 class="text-center fw-bold mb-2">Create Account</h2>
        <p class="text-center text-muted">Basha User Signup</p>

        <form method="POST">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="text" name="mobile" class="form-control" placeholder="Enter mobile number" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <div class="mb-3">
                <label>Select Language</label>
                <select name="language_code" class="form-control" required onchange="setLanguageName(this)">
                    <option value="">Select Language</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="ta">Tamil</option>
                    <option value="kn">Kannada</option>
                    <option value="ml">Malayalam</option>
                    <option value="mr">Marathi</option>
                    <option value="gu">Gujarati</option>
                    <option value="bn">Bengali</option>
                    <option value="pa">Punjabi</option>
                    <option value="or">Odia</option>
                    <option value="as">Assamese</option>
                    <option value="ur">Urdu</option>
                    <option value="sa">Sanskrit</option>
                    <option value="kok">Konkani</option>
                    <option value="mai">Maithili</option>
                    <option value="ne">Nepali</option>
                    <option value="sd">Sindhi</option>
                    <option value="mni">Manipuri</option>
                    <option value="doi">Dogri</option>
                    <option value="ks">Kashmiri</option>
                    <option value="bodo">Bodo</option>
                    <option value="sat">Santali</option>
                </select>

                <input type="hidden" name="language_name" id="language_name">
            </div>
            {% if error %}
            <div class="alert alert-danger mt-2">
                {{ error }}
            </div>
            {% endif %}

            <button class="btn btn-primary w-100">
                Create Account
            </button>

            <div class="text-center mt-3">
                <a href="/">Already have account? Login</a>
            </div>

        </form>

    </div>

</div>
<script>
function setLanguageName(select) {
    const selectedText = select.options[select.selectedIndex].text;
    document.getElementById("language_name").value = selectedText;
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js");
}
</script>

</body>
</html>
