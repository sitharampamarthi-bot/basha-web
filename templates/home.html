<!DOCTYPE html>
<html>
<head>
    <title>Basha Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<nav class="navbar navbar-dark" style="background:#6f42c1;">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-translate"></i> Basha App
        </span>
        <a href="/contacts" class="btn btn-light btn-sm me-2">
            Contacts
        </a>        
        <a href="/" class="btn btn-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow p-4 mb-4" style="border-radius:20px;">
        <h3 class="fw-bold">Welcome to Basha 👋</h3>
        <p class="text-muted mb-0">Chat with users in your language</p>
    </div>

    <div class="card shadow p-4 mb-4" style="border-radius:20px;">
        <h4 class="fw-bold mb-3">Available Contacts</h4>

        {% if contacts|length == 0 %}
            <div class="alert alert-warning mb-0">
                No Basha contacts found. Add contacts or send invite.
            </div>
        {% endif %}

        {% for c in contacts %}
        <div class="d-flex justify-content-between align-items-center border-bottom py-3">
            <div>
                <h5 class="mb-1">{{ c.savedName }}</h5>
                <small class="text-muted">{{ c.mobile }}</small>
            </div>

            <a href="/chat/{{ c.mobile }}" class="btn btn-success btn-sm">
                Chat
            </a>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
