<!DOCTYPE html>
<html>
<head>
    <title>Basha Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<nav class="navbar navbar-dark" style="background:#6f42c1;">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-translate"></i> Basha App
        </span>
        <a href="/" class="btn btn-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow p-4 mb-4" style="border-radius:20px;">
        <h3 class="fw-bold">Welcome to Basha 👋</h3>
        <p class="text-muted mb-0">Chat with users in your language</p>
    </div>

    <div class="row g-3">
        <div class="col-md-6">
        <a href="/contacts" class="text-decoration-none">
            <div class="card shadow p-4 text-center" style="border-radius:20px;">
                <i class="bi bi-person-lines-fill fs-1 text-success"></i>
                <h4 class="mt-3 text-dark">My Contacts</h4>
                <p class="text-muted">Add / invite contacts</p>
            </div>
        </a>
    </div>

    </div>

</div>

</html>
