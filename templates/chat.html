<!DOCTYPE html>
<html>
<head>
    <title>Basha Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f1f1f1;">

<nav class="navbar navbar-dark fixed-top" style="background:#6f42c1;">
    <div class="container-fluid">
        <a href="/contacts" class="btn btn-light btn-sm">←</a>
        <span class="navbar-brand fw-bold">{{ receiver.name }}</span>
        <span></span>
    </div>
</nav>

<div class="container" style="padding-top:80px;padding-bottom:85px;">

    {% for msg in messages %}
        {% if msg.senderMobile == current_mobile %}
            <div class="d-flex justify-content-end mb-2">
                <div class="p-3 text-white"
                     style="background:#198754;border-radius:16px;max-width:70%;">
                    {% if msg.senderMobile == current_mobile %}
                        {{ msg.message }}
                    {% else %}
                        {{ msg.translatedMessage }}
                    {% endif %}
                </div>
            </div>
        {% else %}
            <div class="d-flex justify-content-start mb-2">
                <div class="p-3 text-dark"
                     style="background:#e1e1e1;border-radius:16px;max-width:70%;">
                    {{ msg.message }}
                </div>
            </div>
        {% endif %}
    {% endfor %}

</div>

<div class="fixed-bottom bg-white p-2">
    <form action="/send-message" method="POST" class="d-flex gap-2">
        <input type="hidden" name="receiver_mobile" value="{{ receiver.mobile }}">

        <input type="text"
               name="message"
               class="form-control"
               placeholder="Type message..."
               required
               autocomplete="off">

        <button class="btn btn-success px-4">
            Send
        </button>
    </form>
</div>

</body>
</html>
