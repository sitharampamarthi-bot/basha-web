<!DOCTYPE html>
<html>
<head>
    <title>Basha Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, 
        body {
            height:100%;
            margin:0;
            overflow:hidden;
            font-family:Arial, sans-serif;
        }
        
        .date-divider{
            text-align:center;
            margin:14px auto;
            padding:6px 14px;
            background:#e9ddff;
            color:#4b2785;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
            width:max-content;
        }

        .chat-header {
            height:64px;
            background:#6f42c1;
            color:white;
            display:flex;
            align-items:center;
            gap:12px;
            padding:8px 12px;
            position:fixed;
            top:0;
            left:0;
            right:0;
            z-index:1000;
        }

        .chat-title {
            font-size:18px;
            font-weight:700;
            line-height:1.1;
        }

        .chat-status {
            font-size:12px;
            color:#d9ffd9;
        }

        #messagesBox{
            position:fixed;
            top:64px;
            left:0;
            right:0;
            bottom:70px;
            overflow-y:auto;
            padding:12px;
            background:#f1f1f1;
            scroll-behavior:auto;
        }

        .msg-row {
            display:flex;
            width:100%;
            margin-bottom:8px;
            align-items:flex-end;
        }

        .msg-left {
            justify-content:flex-start;
        }

        .msg-right {
            justify-content:flex-end;
        }

        .msg-bubble {
            display:inline-block;
            width:fit-content !important;
            max-width:72%;
            min-width:45px;
            height:auto !important;
            padding:8px 10px;
            border-radius:14px;
            font-size:16px;
            line-height:1.45;
            word-break:break-word;
            overflow-wrap:anywhere;
            white-space:pre-wrap;
            box-shadow:0 1px 2px rgba(0,0,0,0.12);
        }

        .msg-me {
            background:#198754;
            color:white;
            border-top-right-radius:4px;
            margin-left:auto;
        }

        .msg-other {
            background:#e1e1e1;
            color:#111;
            border-top-left-radius:4px;
            margin-right:auto;
        }

        .chatImage {
            width:auto !important;
            height:auto !important;
            max-width:260px;
            max-height:330px;
            object-fit:contain;
            border-radius:10px;
            display:block;
            margin-top:6px;
            cursor:pointer;
            transition:0.25s;
        }

        .doc-card {
            display:inline-block;
            background:#fff;
            color:#111;
            border-radius:10px;
            padding:10px 12px;
            margin-top:6px;
            text-decoration:none;
            max-width:260px;
            word-break:break-word;
            border:1px solid #ddd;
        }

        .convert-btn {
            background:#ffc107;
            border:none;
            border-radius:14px;
            padding:4px 10px;
            margin-top:6px;
            font-size:12px;
            display:inline-block;
        }

        .msg-status {
            text-align:right;
            font-size:12px;
            margin-top:3px;
            line-height:1;
        }

        .tick-seen {
            color:#53bdeb;
            font-weight:bold;
        }

        .tick-normal {
            color:rgba(255,255,255,0.85);
            font-weight:bold;
        }

        .input-bar{
            position:fixed;
            left:0;
            right:0;
            bottom:0;
            z-index:9999;
            background:#fff;
            border-top:1px solid #ddd;
            padding:8px;
            padding-bottom:env(safe-area-inset-bottom);
        }

        .input-inner {
            display:flex;
            align-items:center;
            width:100%;
            gap:6px;
            flex-wrap:nowrap;
        }

        .file-btn {
            width:42px;
            height:42px;
            min-width:42px;
            flex-shrink:0;
            border-radius:50%;
            border:none;
            background:#eee;
            color:#111;
            font-size:22px;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            margin:0;
        }

        #chatFileInput {
            display:none;
        }

        #messageInput {
            flex:1;
            width:100%;
            min-width:0;
            min-height:42px;
            height:42px;
            max-height:100px;
            resize:none;
            overflow-y:auto;
            border:1px solid #ddd;
            border-radius:22px;
            padding:9px 14px;
            font-size:15px;
        }

        #sendBtn {
            flex-shrink:0;
            width:72px;
            height:42px;
            border-radius:22px;
            background:#198754;
            color:white;
            border:none;
            font-weight:600;
        }

        .emoji-panel {
            display:none;
            position:fixed;
            bottom:64px;
            left:8px;
            right:8px;
            background:white;
            border-radius:14px;
            padding:12px;
            box-shadow:0 4px 18px rgba(0,0,0,0.2);
            z-index:1200;
            font-size:26px;
        }

        .emoji-panel span {
            cursor:pointer;
            margin:6px;
            display:inline-block;
        }

        .file-preview-pill {
            display:none;
            position:fixed;
            bottom:60px;
            left:8px;
            right:8px;
            background:#fff7d6;
            border:1px solid #ffd75c;
            border-radius:12px;
            padding:8px 12px;
            z-index:1300;
            font-size:14px;
        }
        .chatVideo{
            display:block;
            max-width:260px;
            max-height:330px;
            border-radius:12px;
            margin-top:8px;
        }

        @media(max-width:600px) {
            .msg-bubble {
                max-width:84%;
                font-size:15px;
            }

            .chatImage{
                display:block !important;
                width:auto !important;
                max-width:230px !important;
                max-height:320px !important;
                height:auto !important;
                object-fit:contain !important;
            }

            .doc-card{
                display:block !important;
                max-width:220px !important;
            }

            #sendBtn {
                width:70px;
            }
            .file-btn {
                width:42px;
                height:42px;
                min-width:42px;
                flex-shrink:0;
                border-radius:50%;
                border:none;
                background:#eee;
                color:#111;
                font-size:22px;
                display:flex;
                align-items:center;
                justify-content:center;
                cursor:pointer;
                margin:0;
            }

            .input-inner{
                display:flex !important;
                flex-direction:row !important;
                align-items:center !important;
            }
        }
        .msg-text{
            white-space:normal !important;
            display:inline;
        }

        .msg-bubble{
            white-space:normal !important;
            vertical-align:top;
        }

        @media(max-width:600px){
            .input-bar{
                display:block !important;
                position:fixed !important;
                bottom:0 !important;
                left:0 !important;
                right:0 !important;
                z-index:99999 !important;
                background:#fff !important;
            }

            .input-inner{
                display:flex !important;
                flex-direction:row !important;
                align-items:center !important;
                gap:6px !important;
            }

            .file-btn,
            #sendBtn{
                display:flex !important;
                align-items:center !important;
                justify-content:center !important;
                visibility:visible !important;
                opacity:1 !important;
            }

            #messageInput{
                flex:1 !important;
                min-width:0 !important;
                width:auto !important;
            }

            #messagesBox{
                bottom:64px !important;
            }

            .msg-status{
                display:block !important;
            }

            .chatImage,
            video{
                display:block !important;
                max-width:230px !important;
                height:auto !important;
            }

            .doc-card{
                display:block !important;
                max-width:230px !important;
            }
        }
        @media(max-width:600px){
            body.theme-dark .input-bar{
                background:#202020 !important;
                border-color:#333 !important;
            }

            body.theme-dark #messageInput{
                background:#2a2a2a !important;
                color:#fff !important;
                border-color:#444 !important;
            }

            body.theme-dark .file-btn{
                background:#343434 !important;
                color:#fff !important;
            }

            body.theme-dark .emoji-panel{
                background:#292929 !important;
                color:#fff !important;
            }
        }
                .preview-toolbar{
            display:flex;
            gap:10px;
            align-items:center;
            padding:10px;
            border-bottom:1px solid #ddd;
            background:#fafafa;
            position:sticky;
            top:0;
            z-index:5;
        }

        .preview-toolbar button{
            min-width:46px;
        }

        .preview-container{
            display:flex;
            width:100%;
            height:calc(90vh - 120px);
            overflow:hidden;
        }

        .preview-left{
            flex:1;
            min-width:45%;
            overflow:auto;
            background:#f8f8f8;

            display:flex;
            justify-content:center;
            align-items:flex-start;

            padding:15px;
        }

        .preview-right{
            flex:1;
            min-width:55%;
            overflow:auto;
            border-left:1px solid #ddd;
            padding:20px;
            background:white;
        }

        .preview-right h5{
            font-weight:bold;
            margin-bottom:15px;
        }

        .zoomImage{
            width:100%;
            height:auto;
            max-width:none;
            max-height:none;
            display:block;
            transform-origin:top left;
            transition:.2s;
            cursor:grab;
        }

        @media(max-width:768px){

            .modal-dialog{
                margin:10px !important;
                max-width:calc(100vw - 20px) !important;
            }

            .modal-content{
                max-height:88vh !important;
                overflow:hidden !important;
            }

            #previewBody.single-mode{
                display:flex;
                justify-content:center;
                align-items:center;
                padding:10px;
                overflow:auto;
            }

            #previewBody.convert-mode{
                display:block;
                padding:0;
                overflow:hidden;
            }

            .preview-toolbar{
                height:58px;
                gap:8px;
                padding:8px 10px;
                flex-shrink:0;
            }

            .preview-container{
                display:flex !important;
                flex-direction:row !important;
                width:100%;
                height:calc(88vh - 205px);
                overflow:hidden;
            }

            .preview-left{
                width:50% !important;
                min-width:50% !important;
                height:100% !important;
                padding:6px;
                overflow:auto;
                display:flex;
                align-items:flex-start;
                justify-content:center;
            }

            .preview-right{
                width:50% !important;
                min-width:50% !important;
                height:100% !important;
                padding:8px;
                overflow:auto;
                border-left:1px solid #ddd;
            }

            .preview-right h4{
                font-size:16px !important;
                line-height:1.25;
                text-align:center;
            }

            .preview-right p{
                font-size:14px !important;
                line-height:1.55 !important;
                text-align:left;
            }

            .zoomImage{
                width:100%;
                height:auto;
            }
        }
        .single-preview-dialog{
            width:fit-content !important;
            max-width:90vw !important;
        }

        .single-preview-dialog .modal-content{
            width:fit-content !important;
            max-width:90vw !important;
        }

        .single-preview-dialog #previewBody{
            display:flex !important;
            justify-content:center !important;
            align-items:center !important;
            overflow:auto !important;
        }

        .single-preview-wrap{
            width:auto !important;
            display:flex !important;
            justify-content:center !important;
            align-items:center !important;
            padding:10px !important;
        }

        .single-preview-img{
            max-width:85vw !important;
            max-height:72vh !important;
            width:auto !important;
            height:auto !important;
            display:block !important;
        }

        @media(max-width:768px){
            .single-preview-wrap{
                max-height:65vh;
                padding:6px;
            }

            .single-preview-img{
                max-height:62vh;
            }
        }
        body.font-small .msg-bubble{
            font-size:13px;
        }

        body.font-medium .msg-bubble{
            font-size:15px;
        }

        body.font-large .msg-bubble{
            font-size:18px;
        }

        body.theme-dark{
            background:#121212;
            color:#f5f5f5;
        }

        body.theme-dark #messagesBox{
            background:#1d1d1d;
        }

        body.theme-dark .msg-other{
            background:#2c2c2c;
            color:#fff;
        }
        body.theme-dark .msg-me{
            background:#0d8a58;
        }

        body.theme-dark .input-bar{
            background:#202020;
            border-color:#333;
        }

        body.theme-dark #messageInput{
            background:#2a2a2a;
            color:#fff;
            border-color:#444;
        }

        body.wallpaper-plain #messagesBox{
            background:#f2f2f2;
        }

        body.wallpaper-purple #messagesBox{
            background-image:linear-gradient(
                135deg,
                #f3edff,
                #e8dcff
            );
        }
        @media (prefers-color-scheme: dark){
            body.theme-system{
                background:#121212;
                color:#f5f5f5;
            }

            body.theme-system #messagesBox{
                background:#1d1d1d;
            }

            body.theme-system .msg-other{
                background:#2c2c2c;
                color:#fff;
            }

            body.theme-system .input-bar{
                background:#202020;
                border-color:#333;
            }

            body.theme-system #messageInput{
                background:#2a2a2a;
                color:#fff;
                border-color:#444;
            }

            body.theme-system .file-btn{
                background:#343434;
                color:#fff;
            }
            body.theme-system .msg-me{
                background:#0d8a58;
            }
        }
</style>
</head>

<body class="
    theme-{{ chat_theme or 'system' }}
    font-{{ chat_font_size or 'medium' }}
    wallpaper-{{ wallpaper or 'default' }}
">

<div class="chat-header">
    <a href="{{ back_url if back_url else '/home' }}" class="btn btn-light btn-sm">←</a>

    <div>
        <div class="chat-title">{{ receiver.name }}</div>
        <div id="userStatusText" class="chat-status">checking...</div>
    </div>
</div>

<div id="messagesBox">

    {% set show_original = show_original_text %}

    {% include "message_bubbles.html" %}

</div>                    

<div class="emoji-panel" id="emojiPanel">
    <span onclick="addEmoji('😀')">😀</span>
    <span onclick="addEmoji('😂')">😂</span>
    <span onclick="addEmoji('😍')">😍</span>
    <span onclick="addEmoji('👍')">👍</span>
    <span onclick="addEmoji('🙏')">🙏</span>
    <span onclick="addEmoji('❤️')">❤️</span>
    <span onclick="addEmoji('🔥')">🔥</span>
    <span onclick="addEmoji('🎉')">🎉</span>
</div>
<div id="filePreviewPill" class="file-preview-pill">
    📎 <span id="selectedFileName"></span>
    <button type="button" onclick="clearSelectedFile()" style="float:right;border:none;background:none;">✕</button>
</div>

<div class="input-bar">
    <form id="messageForm" method="POST" enctype="multipart/form-data" class="input-inner">
        <input type="hidden" name="receiver_mobile" id="receiver_mobile" value="{{ receiver.mobile }}">

        <label for="chatFileInput" class="file-btn">＋</label>
        <input type="file" name="chat_files" id="chatFileInput"
               accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" multiple>

        <button type="button" class="file-btn" onclick="toggleEmoji()">😊</button>
        
        <textarea name="message" id="messageInput" placeholder="Type message..."></textarea>

        <button
            type="button"
            id="recordBtn"
            class="file-btn">
            🎙
        </button>

        <button id="sendBtn" type="submit">Send</button>
    </form>
</div>
<div class="modal fade" id="filePreviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content" style="border-radius:18px;">
            <div class="modal-header">
                <h5 class="modal-title">File Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-0" id="previewBody"></div>

            <div class="modal-footer">
                <button type="button" id="copyTextBtn" class="btn btn-info" style="display:none;">Copy Text</button>
                <a id="downloadBtn" href="#" download class="btn btn-success">Download</a>
                <button type="button" id="sendConvertedBtn" class="btn btn-primary" style="display:none;">Send Text</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let convertedTextGlobal = "";
let isSending = false;
let isRefreshing = false;
let typingTimer = null;
const receiverMobile = document.getElementById("receiver_mobile").value;
const fileInput = document.getElementById("chatFileInput");
const messageInput =
document.getElementById("messageInput");

messageInput.addEventListener("input",function(){

    this.style.height="42px";

    this.style.height=
    this.scrollHeight+"px";

});

const enterToSend =
{{ enter_to_send|default(false)|tojson }};

if (enterToSend) {
    const input = document.getElementById("messageInput");
    const form = document.getElementById("messageForm");

    if (input && form) {
        input.addEventListener("keydown", function(e) {
            if(
                e.key==="Enter" &&
                !e.shiftKey &&
                !e.ctrlKey &&
                !e.altKey &&
                !e.isComposing
            ) {
                e.preventDefault();
                form.requestSubmit();
            }
        });
    }
}

fileInput.addEventListener("change", function () {
    const pill = document.getElementById("filePreviewPill");
    const nameSpan = document.getElementById("selectedFileName");

    if (this.files.length > 0) {
        let names = [];

        for (let i=0; i < this.files.length; i++){
            names.push(this.files[i].name);
        }
        if(names.length==1){

        nameSpan.innerText=names[0];

        }else{

        nameSpan.innerText=names.length+" files selected";

        }
        pill.style.display = "block";
    } else {
        nameSpan.innerText = "";
        pill.style.display = "none";
    }
});

function clearSelectedFile() {
    fileInput.value = "";
    document.getElementById("selectedFileName").innerText = "";
    document.getElementById("filePreviewPill").style.display = "none";
}

function scrollBottom(smooth = false) {
    const box = document.getElementById("messagesBox");

    if (!box) {
        return;
    }

    box.scrollTo({
        top: box.scrollHeight,
        behavior: smooth ? "smooth" : "auto"
    });
}

function isNearBottom() {
    const box = document.getElementById("messagesBox");
    return (box.scrollTop + box.clientHeight) >= (box.scrollHeight - 200);
}

let lastMessagesHtml =
    document.getElementById("messagesBox").innerHTML;

function loadMessages(forceBottom = false) {
    if (isRefreshing || isSending) return;
    isRefreshing = true;

    const stayBottom = isNearBottom();

    fetch("/get-messages/" + receiverMobile, { cache: "no-store" })
        .then(res => res.text())
        .then(html => {
            if (html.trim() !== lastMessagesHtml.trim()) {
                lastMessagesHtml = html;
                document.getElementById("messagesBox").innerHTML = html;

                if (forceBottom || stayBottom) {
                    setTimeout(function () {
                        scrollBottom(true);
                    }, 50);
                }
            }
        })
        .finally(() => {
            isRefreshing = false;
        });
}

function openPreview(url, type, name) {
    const dialog = document.querySelector("#filePreviewModal .modal-dialog");
    dialog.classList.add("single-preview-dialog");
    dialog.style.maxWidth = "";

    const body = document.getElementById("previewBody");
    body.className = "modal-body p-0 single-mode";
    const downloadBtn = document.getElementById("downloadBtn");
    const sendBtn = document.getElementById("sendConvertedBtn");
    const copyBtn = document.getElementById("copyTextBtn");

    if (sendBtn) sendBtn.style.display = "none";
    if (copyBtn) copyBtn.style.display = "none";

    downloadBtn.style.display = "inline-block";
    downloadBtn.href =
        "/download-file?url=" +
        encodeURIComponent(url) +
        "&name=" +
        encodeURIComponent(name || "basha-file");
    downloadBtn.setAttribute("download", name || "basha-image.jpg");
    downloadBtn.removeAttribute("target");

    if (type === "image") {
        body.innerHTML = `
        <div class="single-preview-wrap">
            <img src="${url}" class="single-preview-img">
        </div>
        `;
    } else if (type === "video") {
        body.innerHTML = `<video controls style="max-width:100%;border-radius:12px;"><source src="${url}"></video>`;
    } else {
        body.innerHTML = `
        <iframe
            src="${url}"
            style="width:100%;height:75vh;border:none;border-radius:12px;">
        </iframe>
        `;
    }

    bootstrap.Modal.getOrCreateInstance(document.getElementById("filePreviewModal")).show();
}

function convertImageText(imageUrl) {
    const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("filePreviewModal"));
    const body = document.getElementById("previewBody");
    const dialog = document.querySelector("#filePreviewModal .modal-dialog");
    dialog.classList.remove("single-preview-dialog");
    dialog.style.maxWidth = "";
    body.className = "modal-body p-0 convert-mode";
    document.querySelector("#filePreviewModal .modal-dialog").style.maxWidth = "";
    const downloadBtn = document.getElementById("downloadBtn");
    const sendBtn = document.getElementById("sendConvertedBtn");
    const copyBtn = document.getElementById("copyTextBtn");

    body.innerHTML = `<div class="p-4 text-center"><h5>Converting image...</h5><p>Please wait...</p></div>`;

    downloadBtn.style.display = "none";
    if (sendBtn) sendBtn.style.display = "none";
    if (copyBtn) copyBtn.style.display = "none";

    modal.show();

    fetch("/convert-image-text", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ image_url: imageUrl })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            body.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            return;
        }

        let lines = data.translated_text || [];
        if (typeof lines === "string") lines = [lines];

        convertedTextGlobal = lines.join("\n\n");        

        body.innerHTML=`

        <div class="preview-toolbar">
            <button class="btn btn-dark btn-sm"
                onclick="zoomOut()">−</button>
            <span id="zoomPercent">100%</span>
            <button class="btn btn-dark btn-sm"
                onclick="zoomIn()">+</button>
            <button class="btn btn-secondary btn-sm"
                onclick="fitImage()">Fit</button>
        </div>

        <div class="preview-container">
            <div class="preview-left">
                <img
                    id="previewImage"
                    class="zoomImage"
                    src="${data.translated_image_url}">
            </div>

            <div class="preview-right">
                <h4>
                    🌐
                    Translated Content - ${data.language}
                </h4>
                <hr>
                    ${lines.map(line=>`
                        <p style="font-size:18px;line-height:1.7">
                            ${line}
                        </p>
                    `).join("")}
            </div>

        </div>

        `;

        window.zoomScale=1;

        downloadBtn.href =
            "/download-file?url=" +
            encodeURIComponent(data.translated_image_url) +
            "&name=" +
            encodeURIComponent("translated-image.jpg");
        downloadBtn.setAttribute("download", "translated-image.jpg");
        downloadBtn.removeAttribute("target");
        downloadBtn.style.display = "inline-block";

        if (sendBtn) sendBtn.style.display = "inline-block";
        if (copyBtn) copyBtn.style.display = "inline-block";
    });
}

function toggleEmoji() {
    const panel = document.getElementById("emojiPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
}

function addEmoji(emoji) {
    const input = document.getElementById("messageInput");
    input.value += emoji;
    input.focus();
}

function updatePresence() {
    fetch("/update-presence", { method: "POST" });
}

function setTypingStatus(status) {
    fetch("/set-typing", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            receiver_mobile: receiverMobile,
            is_typing: status
        })
    });
}

function loadChatStatus() {
    fetch("/chat-status/" + receiverMobile)
        .then(res => res.json())
        .then(data => {
            if (!data.success) return;

            const statusEl = document.getElementById("userStatusText");

            if (data.isTyping) {
                statusEl.innerHTML = "✍️ typing...";
            } else if (data.isOnline) {
                statusEl.innerHTML = "🟢 Online";
            } else {
                statusEl.innerHTML = "⚫ Offline";
            }
        });
}

document.getElementById("messageInput").addEventListener("input", function () {
    setTypingStatus(true);
    clearTimeout(typingTimer);

    typingTimer = setTimeout(function () {
        setTypingStatus(false);
    }, 1500);
});

document.getElementById("messageForm").addEventListener("submit", function(e) {
    e.preventDefault();

    if (isSending) return;

    const form = document.getElementById("messageForm");
    const msg = document.getElementById("messageInput");
    const file = document.getElementById("chatFileInput");
    const btn = document.getElementById("sendBtn");

    msg.value = msg.value.trim();
    if (msg.value.trim() === "" && file.files.length === 0) return;

    isSending = true;
    btn.disabled = true;
    btn.innerText = "...";

    let tempHtml = "";

    if (msg.value) {
        tempHtml += `
            <div class="msg-row msg-right temp-msg">
                <div class="msg-bubble msg-me">
                    <div class="msg-text">${msg.value}</div>
                    <div class="msg-status"><span class="tick-normal">⏳</span></div>
                </div>
            </div>`;
    }

    if (file.files.length > 0) {
        for (let i = 0; i < file.files.length; i++) {
            let localUrl = URL.createObjectURL(file.files[i]);
            let type = file.files[i].type;

            if (type.startsWith("image/")) {
                tempHtml += `
                    <div class="msg-row msg-right temp-msg">
                        <div class="msg-bubble msg-me">
                            <img src="${localUrl}" class="chatImage">
                            <div class="msg-status"><span class="tick-normal">Uploading...</span></div>
                        </div>
                    </div>`;
            } else {
                tempHtml += `
                    <div class="msg-row msg-right temp-msg">
                        <div class="msg-bubble msg-me">
                            <div class="doc-card">📎 ${file.files[i].name}</div>
                            <div class="msg-status"><span class="tick-normal">Uploading...</span></div>
                        </div>
                    </div>`;
            }
        }
    }

document.getElementById("messagesBox").insertAdjacentHTML("beforeend", tempHtml);
    scrollBottom(true);

    fetch("/send-message", {
        method: "POST",
        body: new FormData(form)
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            msg.value = "";
            file.value = "";
            document.getElementById("filePreviewPill").style.display = "none";
            setTypingStatus(false);
            loadMessages(true);

            setTimeout(function () {
                scrollBottom(true);
            }, 100);
        } else {
            console.log(data.error || "Send failed");
        }
    })
    .finally(() => {
        isSending = false;
        btn.disabled = false;
        btn.innerText = "Send";
    });
});

document.getElementById("sendConvertedBtn").addEventListener("click", function () {
    document.getElementById("messageInput").value = convertedTextGlobal;
    bootstrap.Modal.getInstance(document.getElementById("filePreviewModal")).hide();
});

document.getElementById("copyTextBtn").addEventListener("click", function () {
    navigator.clipboard.writeText(convertedTextGlobal);
    this.innerText = "Copied";
    setTimeout(() => this.innerText = "Copy Text", 1200);
});

function openChatAtBottom() {
    const box = document.getElementById("messagesBox");

    if (!box) {
        return;
    }

    box.style.visibility = "hidden";

    const images = Array.from(
        box.querySelectorAll("img")
    );

    const imagePromises = images.map(function (img) {
        if (img.complete) {
            return Promise.resolve();
        }

        return new Promise(function (resolve) {
            img.addEventListener("load", resolve, { once:true });
            img.addEventListener("error", resolve, { once:true });
        });
    });

    const maximumWait = new Promise(function (resolve) {
        setTimeout(resolve, 700);
    });

    Promise.race([
        Promise.all(imagePromises),
        maximumWait
    ]).finally(function () {

        scrollBottom(false);

        requestAnimationFrame(function () {
            scrollBottom(false);
            box.style.visibility = "visible";
        });

    });
}


window.addEventListener("load", function () {
    updatePresence();
    loadChatStatus();
    openChatAtBottom();
});

setInterval(updatePresence, 15000);
setInterval(loadChatStatus, 5000);
setInterval(function() {

}, 3000);

document
    .getElementById("messageInput")

        }, 300);

window.zoomScale=1;

function zoomIn(){
    window.zoomScale+=0.1;
    updateZoom();
}

function zoomOut(){
    window.zoomScale-=0.1;
    if(window.zoomScale<0.3)
    window.zoomScale=0.3;
    updateZoom();
}

function fitImage(){
    window.zoomScale=1;
    updateZoom();
}

function updateZoom(){
    const img=document.getElementById("previewImage");
    if(!img) return;
    img.style.transform=`scale(${window.zoomScale})`;
    document.getElementById("zoomPercent").innerText=
    Math.round(window.zoomScale*100)+"%";
}
let mediaRecorder;
let audioChunks = [];
let recording = false;

document.getElementById("recordBtn").addEventListener("click", async function () {
    const btn = this;

    if (!recording) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function (e) {
            audioChunks.push(e.data);
        };

        mediaRecorder.onstop = function () {
            sendRecordedAudio();
        };

        mediaRecorder.start();
        recording = true;
        btn.innerText = "⏹";
        btn.style.background = "#dc3545";
        return;
    }

    mediaRecorder.stop();
    recording = false;
    btn.innerText = "🎙";
    btn.style.background = "";
});

function sendRecordedAudio() {
    const blob = new Blob(audioChunks, { type: "audio/webm" });

    const formData = new FormData();
    formData.append("receiver_mobile", receiverMobile);
    formData.append("audio", blob, "voice.webm");

    document.getElementById("sendBtn").disabled = true;

    fetch("/audio/translate-send", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) {
            alert(data.error || "Audio translation failed");
            return;
        }

        loadMessages(true);

        const audioUrl =
            data.original_audio_url || data.audio_url;

        const audio = new Audio(audioUrl);

        audio.play().catch(function () {
            // Browser autoplay block ayithe ignore.
        });
    })
    .finally(() => {
        document.getElementById("sendBtn").disabled = false;
    });
}
