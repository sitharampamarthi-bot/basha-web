<!DOCTYPE html>
<html>
<head>
    <title>Basha Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f1f1f1;">

<nav class="navbar navbar-dark fixed-top" style="background:#6f42c1;">
    <div class="container-fluid">
        <a href="/contacts" class="btn btn-light btn-sm">←</a>
        <span class="navbar-brand fw-bold">{{ receiver.name }}</span>
        <span></span>
    </div>
</nav>

<div id="messagesBox" class="container" style="padding-top:80px;padding-bottom:85px;">

    {% for msg in messages %}

        {% if msg.senderMobile == current_mobile %}

            <div class="d-flex justify-content-end mb-2">
                <div class="p-3 text-white"
                    style="background:#198754;border-radius:16px;max-width:70%;">
                    {{ msg.message }}
                </div>
            </div>

        {% else %}

            <div class="d-flex justify-content-start mb-2">
                <div class="p-3 text-dark"
                    style="background:#e1e1e1;border-radius:16px;max-width:70%;">
                    {{ msg.translatedMessage or msg.message }}
                </div>
            </div>

        {% endif %}

    {% endfor %}

</div>

<div class="fixed-bottom bg-white p-2">
    <form id="messageForm" class="d-flex gap-2">
        <input type="hidden" id="receiver_mobile" value="{{ receiver.mobile }}">

        <input type="text"
               id="messageInput"
               class="form-control"
               placeholder="Type message..."
               required
               autocomplete="off">

        <button class="btn btn-success px-4" type="submit">
            Send
        </button>
    </form>
</div>

<script>
document.getElementById("messageForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let msg = document.getElementById("messageInput").value.trim();
    let receiver = document.getElementById("receiver_mobile").value;

    if (!msg) return;

    document.getElementById("messageInput").value = "";

    fetch("/send-message-ajax", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            receiver_mobile: receiver,
            message: msg
        })
    }).then(() => {
        loadMessages();
    });
});

function loadMessages() {
    let receiver = document.getElementById("receiver_mobile").value;

    fetch("/get-messages/" + receiver)
        .then(res => res.text())
        .then(html => {
            document.getElementById("messagesBox").innerHTML = html;
            window.scrollTo(0, document.body.scrollHeight);
        });
}

setInterval(loadMessages, 2000);
</script>

</body>
</html>
