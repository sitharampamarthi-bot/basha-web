<!DOCTYPE html>
<html>
<head>
    <title>Create Group</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f2ff;">

<nav class="navbar navbar-dark" style="background:#6f42c1;">
    <div class="container-fluid">
        <a href="/home" class="btn btn-light btn-sm">←</a>
        <span class="navbar-brand fw-bold">Create Group</span>
        <span></span>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow p-4" style="border-radius:20px;">
        <form method="POST">
            <label class="fw-bold mb-2">Group Name</label>
            <input type="text" name="group_name" class="form-control mb-4" required>

            <h5 class="fw-bold mb-3">Select Members</h5>

            {% for c in contacts %}
            <div class="form-check border-bottom py-2">
                <input class="form-check-input" type="checkbox" name="members" value="{{ c.mobile }}">
                <label class="form-check-label">
                    {{ c.savedName }} - {{ c.mobile }}
                </label>
            </div>
            {% endfor %}

            <button id="createBtn" class="btn btn-primary w-100 mt-4">
                Create Group
            </button>
            <script>
            document.querySelector("form").addEventListener("submit", function(){
                document.getElementById("createBtn").disabled = true;
                document.getElementById("createBtn").innerText = "Creating...";
            });
            </script>
        </form>
    </div>
</div>

</body>
</html>
