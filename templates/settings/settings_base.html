<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>{% block title %}Basha Settings{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="{{ url_for('static', filename='css/settings.css') }}"
          rel="stylesheet">
</head>

<body>

<nav class="settings-topbar">

    <a href="{% block back_url %}/settings{% endblock %}"
       class="icon-button"
       aria-label="Back">
        <i class="bi bi-arrow-left"></i>
    </a>

    <h1 class="settings-topbar-title">
        {% block header_title %}Settings{% endblock %}
    </h1>

    <div class="settings-topbar-actions">

        <button
            type="button"
            id="settingsSearchToggle"
            class="icon-button"
            aria-label="Search Settings"
            title="Search">

            <i class="bi bi-search"></i>

        </button>

        <a href="/home"
        class="icon-button"
        aria-label="Home">

            <i class="bi bi-house-door-fill"></i>

        </a>

    </div>

</nav>

<main class="settings-shell">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}

            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ message }}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>

        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{{ url_for('static', filename='js/settings.js') }}">
</script>

{% block scripts %}{% endblock %}

</body>
</html>
