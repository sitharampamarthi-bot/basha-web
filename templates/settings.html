<!DOCTYPE html>
<html>
<head>
    <title>Basha Settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#f5f2ff,#eee6ff);
            font-family:Arial, sans-serif;
        }
        .topbar{
            background:#6f42c1;
            padding:14px 18px;
            color:white;
        }
        .settings-card{
            border:none;
            border-radius:24px;
            box-shadow:0 18px 40px rgba(70,40,120,0.15);
        }
        .profile-circle{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#6f42c1;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
            font-weight:bold;
            overflow:hidden;
        }
        .profile-circle img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .form-control,.form-select{
            height:50px;
            border-radius:14px;
        }
        .btn-main{
            background:#6f42c1;
            border:none;
            border-radius:14px;
            height:48px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<nav class="topbar d-flex align-items-center justify-content-between">
    <a href="/home" class="btn btn-light btn-sm">
        <i class="bi bi-arrow-left"></i>
    </a>

    <div class="fw-bold fs-4">Settings</div>

    <a href="/" class="btn btn-light btn-sm">Logout</a>
</nav>

<div class="container my-4" style="max-width:850px;">

    {% if message %}
    <div class="alert alert-info">
        {{ message }}
    </div>
    {% endif %}

    <div class="card settings-card p-4 mb-4 text-center">
        <div class="d-flex justify-content-center mb-3">
            <div class="profile-circle">
                {% if user.profilePic %}
                    <img src="{{ user.profilePic }}">
                {% else %}
                    {{ user.name[:1] }}
                {% endif %}
            </div>
        </div>

        <h3 class="fw-bold mb-1">{{ user.name }}</h3>
        <p class="text-muted mb-0">{{ user.mobile }}</p>
        <p class="text-muted">Language: {{ user.languageName }}</p>
    </div>

    <div class="card settings-card p-4 mb-4">
        <h4 class="fw-bold mb-3">
            <i class="bi bi-person-circle"></i> Profile Details
        </h4>

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="action" value="profile">

            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control mb-3"
                   value="{{ user.name }}" required>

            <label class="form-label">Mobile Number</label>
            <input type="text" name="mobile" class="form-control mb-3"
                   value="{{ user.mobile }}" required>

            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control mb-3"
                   value="{{ user.email }}">

            <label class="form-label">Profile Picture</label>
            <input
                type="file"
                name="profile_image"
                accept="image/*"
                class="form-control mb-3">

            <button class="btn btn-primary btn-main w-100">
                Save Profile
            </button>
        </form>
    </div>

    <div class="card settings-card p-4 mb-4">
        <h4 class="fw-bold mb-3">
            <i class="bi bi-translate"></i> Language Change
        </h4>

        <form method="POST">
            <input type="hidden" name="action" value="language">

            <label class="form-label">Select Language</label>
            <select name="language_code" class="form-select mb-3" required
                    onchange="document.getElementById('language_name').value=this.options[this.selectedIndex].text">

                <option value="{{ user.languageCode }}">{{ user.languageName }}</option>

                <option value="en">English</option>
                <option value="te">Telugu</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="kn">Kannada</option>
                <option value="ml">Malayalam</option>
                <option value="mr">Marathi</option>
                <option value="gu">Gujarati</option>
                <option value="bn">Bengali</option>
                <option value="ur">Urdu</option>

                <option value="ne">Nepali</option>
                <option value="si">Sinhala</option>
                <option value="my">Burmese</option>
                <option value="th">Thai</option>
                <option value="ar">Arabic</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
                <option value="zh-CN">Chinese</option>
                <option value="ja">Japanese</option>
            </select>

            <input type="hidden" name="language_name" id="language_name"
                   value="{{ user.languageName }}">

            <button class="btn btn-primary btn-main w-100">
                Update Language
            </button>
        </form>
    </div>

    <div class="card settings-card p-4 mb-4">
        <h4 class="fw-bold mb-3">
            <i class="bi bi-lock-fill"></i> Change Password
        </h4>

        <form method="POST">
            <input type="hidden" name="action" value="password">

            <label class="form-label">Old Password</label>
            <input type="password" name="old_password" class="form-control mb-3" required>

            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control mb-3" required>

            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control mb-3" required>

            <button class="btn btn-danger w-100" style="height:48px;border-radius:14px;font-weight:bold;">
                Change Password
            </button>
        </form>
    </div>

</div>

</body>
</html>
