<!-- ==========================================
     BASHA ADVANCED AI FLOATING BUTTON
=========================================== -->

<button type="button"
        class="basha-ai-floating-button"
        id="bashaAiOpenButton"
        title="Open Basha AI Assistant"
        aria-label="Open Basha AI Assistant">

    <span class="basha-ai-floating-glow"></span>

    <span class="basha-ai-floating-avatar"
          id="bashaAiTopAvatar">

        <img src="{{ url_for('static', filename='images/ai/idle-1.png') }}"
            data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"
            alt="Laxmi AI Assistant">

    </span>

    <span class="basha-ai-floating-label">
        Ask AI
    </span>

</button>


<!-- ==========================================
     FLYING AVATAR
=========================================== -->

<div class="basha-ai-flying-avatar"
     id="bashaAiFlyingAvatar"
     hidden
     aria-hidden="true">

    <img src="{{ url_for('static', filename='images/ai/idle-1.png') }}"
        data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"
        alt="Laxmi">

</div>


<!-- ==========================================
     AI ASSISTANT SHELL
=========================================== -->

<div class="basha-ai-shell"
     id="bashaAiShell"

     data-idle-1="{{ url_for('static', filename='images/ai/idle-1.png') }}"
     data-idle-2="{{ url_for('static', filename='images/ai/idle-2.png') }}"
     data-idle-3="{{ url_for('static', filename='images/ai/idle-3.png') }}"

     data-blink-1="{{ url_for('static', filename='images/ai/blink-1.png') }}"
     data-blink-2="{{ url_for('static', filename='images/ai/blink-2.png') }}"

     data-wave-1="{{ url_for('static', filename='images/ai/wave-1.png') }}"
     data-wave-2="{{ url_for('static', filename='images/ai/wave-2.png') }}"
     data-wave-3="{{ url_for('static', filename='images/ai/wave-3.png') }}"

     data-thinking-1="{{ url_for('static', filename='images/ai/thinking-1.png') }}"
     data-thinking-2="{{ url_for('static', filename='images/ai/thinking-2.png') }}"
     data-thinking-3="{{ url_for('static', filename='images/ai/thinking-3.png') }}"

     data-speaking-1="{{ url_for('static', filename='images/ai/speaking-1.png') }}"
     data-speaking-2="{{ url_for('static', filename='images/ai/speaking-2.png') }}"
     data-speaking-3="{{ url_for('static', filename='images/ai/speaking-3.png') }}"
     data-speaking-4="{{ url_for('static', filename='images/ai/speaking-4.png') }}"

     data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"

     hidden>


    <div class="basha-ai-backdrop"
         id="bashaAiBackdrop">
    </div>


    <section class="basha-ai-panel"
             id="bashaAiPanel"
             role="dialog"
             aria-modal="true"
             aria-labelledby="bashaAiTitle">


        <!-- HEADER -->

        <header class="basha-ai-header">

            <div class="basha-ai-header-profile">

                <div class="basha-ai-avatar-wrap">

                    <img src="{{ url_for('static', filename='images/ai/idle-1.png') }}"
                        data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"
                        class="basha-ai-avatar"
                        id="bashaAiHeaderAvatar"
                        alt="Laxmi AI Assistant">

                    <span class="basha-ai-online-dot"></span>

                </div>


                <div class="basha-ai-header-text">

                    <h5 id="bashaAiTitle">
                        Laxmi AI Assistant
                    </h5>

                    <span class="basha-ai-status"
                          id="bashaAiStatus">
                        Online
                    </span>

                </div>

            </div>


            <div class="basha-ai-header-actions">

                <button type="button"
                        class="basha-ai-icon-button"
                        id="bashaAiVoiceToggle"
                        title="Voice reply on or off"
                        aria-label="Voice reply on or off">

                    <i class="bi bi-volume-up-fill"></i>

                </button>


                <button type="button"
                        class="basha-ai-icon-button"
                        id="bashaAiClearButton"
                        title="Clear conversation"
                        aria-label="Clear conversation">

                    <i class="bi bi-trash3"></i>

                </button>


                <button type="button"
                        class="basha-ai-icon-button"
                        id="bashaAiCloseButton"
                        title="Close"
                        aria-label="Close assistant">

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>

        </header>


        <!-- CHARACTER -->

        <div class="basha-ai-character-section"
             id="bashaAiCharacterSection">

            <div class="basha-ai-character-orbit"></div>

            <div class="basha-ai-character-glow"></div>


            <img src="{{ url_for('static', filename='images/ai/idle-1.png') }}"
                data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"
                class="basha-ai-character"
                id="bashaAiCharacter"
                alt="Laxmi AI Assistant">


            <div class="basha-ai-intro-bubble"
                 id="bashaAiIntroBubble">

                <span class="basha-ai-intro-loading">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </div>

        </div>


        <!-- CHAT MESSAGES -->

        <div class="basha-ai-messages"
             id="bashaAiMessages"
             aria-live="polite">
        </div>


        <!-- THINKING -->

        <div class="basha-ai-thinking"
             id="bashaAiThinking"
             hidden>

            <div class="basha-ai-mini-avatar">

                <img src="{{ url_for('static', filename='images/ai/thinking-1.png') }}"
                    data-fallback-src="{{ url_for('static', filename='images/basha-ai-assistant.png') }}"
                    id="bashaAiThinkingAvatar"
                    alt="Laxmi thinking">

            </div>


            <div class="basha-ai-thinking-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <!-- ERROR -->

        <div class="basha-ai-error"
             id="bashaAiError"
             hidden>
        </div>


        <!-- INPUT -->

        <footer class="basha-ai-input-area">

            <button type="button"
                    class="basha-ai-mic-button"
                    id="bashaAiMicButton"
                    title="Speak"
                    aria-label="Speak your question">

                <i class="bi bi-mic-fill"></i>

            </button>


            <textarea id="bashaAiInput"
                      rows="1"
                      maxlength="5000"
                      placeholder="Ask Basha AI..."
                      aria-label="Ask Basha AI"></textarea>


            <button type="button"
                    class="basha-ai-send-button"
                    id="bashaAiSendButton"
                    title="Send"
                    aria-label="Send message">

                <i class="bi bi-send-fill"></i>

            </button>

        </footer>


        <div class="basha-ai-input-help">

            <span id="bashaAiVoiceStatus">
                Type or tap microphone
            </span>

            <span id="bashaAiCharacterCount">
                0 / 5000
            </span>

        </div>

    </section>

</div>
