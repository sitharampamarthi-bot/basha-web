    <!DOCTYPE html>
    <html>
    <head>
        <title>Basha Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    </head>

    <body style="background:#f5f2ff;">

    <nav class="navbar navbar-dark" style="background:#6f42c1;">
        <div class="container-fluid">
            <a href="/home" class="btn btn-light btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="navbar-brand fw-bold">My Contacts</span>
            <a href="/" class="btn btn-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow p-4 mb-4" style="border-radius:20px;">
            <h4 class="fw-bold mb-3">Add Contact</h4>

            {% if message %}
            <div class="alert alert-info">{{ message }}</div>
            {% endif %}

            <form method="POST">
                <input type="text" name="saved_name" class="form-control mb-3" placeholder="Saved Name">
                <input type="text" name="mobile" class="form-control mb-3" placeholder="Mobile Number" required>

                <button class="btn btn-primary w-100">
                    Add Contact
                </button>
                <button type="button" class="btn btn-dark w-100 mb-3" onclick="selectPhoneContact()">
                    <i class="bi bi-person-lines-fill"></i> Select From Phone Contacts
                </button>

                <div id="contactResult"></div>
            </form>

            <a class="btn btn-success w-100 mt-3"
            href="https://wa.me/?text=Join%20Basha%20App%20and%20chat%20with%20me:%20http://127.0.0.1:5000"
            target="_blank">
                <i class="bi bi-whatsapp"></i> Invite on WhatsApp
            </a>
        </div>

        {% if contacts|length == 0 %}
            <div class="alert alert-warning text-center">
                No contacts added
            </div>
        {% endif %}

        {% for user in contacts %}
        <div class="card shadow-sm mb-3" style="border-radius:18px;">
            <div class="card-body d-flex align-items-center">

                <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
                    style="width:55px;height:55px;background:#e7ddff;color:#6f42c1;font-size:25px;">
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="flex-grow-1">
                    <h5 class="mb-1">{{ user.savedName }}</h5>
                    <div class="text-muted small">{{ user.mobile }}</div>
                    <div class="text-muted small">Language: {{ user.languageName }}</div>
                </div>

                <a href="/chat/{{ user.mobile }}" class="btn btn-success">
                    <i class="bi bi-chat-dots-fill"></i>
                </a>

            </div>
        </div>
        {% endfor %}

    </div>
    <script>
    async function selectPhoneContact() {
        if (!('contacts' in navigator)) {
            alert("Phone contacts option only works in supported mobile browsers like Android Chrome.");
            return;
        }

        try {
            const props = ['name', 'tel'];
            const opts = { multiple: true };

            const contacts = await navigator.contacts.select(props, opts);

            for (const contact of contacts) {
                const name = contact.name ? contact.name[0] : "";
                const mobile = contact.tel ? contact.tel[0] : "";

                const res = await fetch("/check-phone-contact", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        mobile: mobile
                    })
                });

                const data = await res.json();

                document.getElementById("contactResult").innerHTML += `
                    <div class="alert alert-info">
                        ${name} - ${mobile} : ${data.message}
                    </div>
                `;
            }

            setTimeout(() => {
                window.location.reload();
            }, 1500);

        } catch (e) {
            alert("Contact selection cancelled or not supported.");
        }
    }
    </script>
        
    </body>
    </html>
