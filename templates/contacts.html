    <!DOCTYPE html>
    <html>
    <head>
        <title>Basha Contacts</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    </head>

    <body style="background:#f5f2ff;">

    <nav class="navbar navbar-dark" style="background:#6f42c1;">
        <div class="container-fluid">
            <a href="/home" class="btn btn-light btn-sm">
                <i class="bi bi-arrow-left"></i>
            </a>
            <span class="navbar-brand fw-bold">My Contacts</span>
            <a href="/logout" class="btn btn-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="card shadow p-4 mb-4" style="border-radius:20px;">
            <h4 class="fw-bold mb-3">Add Contact</h4>

            {% if message %}
            <div class="alert alert-info">{{ message }}</div>
            {% endif %}

            <form method="POST">
                <input type="text" name="saved_name" class="form-control mb-3" placeholder="Saved Name">
                <input type="text" name="mobile" class="form-control mb-3" placeholder="Mobile Number" required>

                <button class="btn btn-primary w-100">
                    Add Contact
                </button>
                <button type="button" class="btn btn-dark w-100 mb-3" onclick="selectPhoneContact()">
                    <i class="bi bi-person-lines-fill"></i> Select From Phone Contacts
                </button>

                <div id="contactResult"></div>
            </form>

            <button type="button"
                    class="btn btn-success w-100 mt-3"
                    onclick="inviteBashaOnWhatsApp()">

                <i class="bi bi-whatsapp"></i>
                    Invite on WhatsApp

            </button>
        </div>

        {% if contacts|length == 0 %}
            <div class="alert alert-warning text-center">
                No contacts added
            </div>
        {% endif %}

        {% for user in contacts %}
        <div class="card shadow-sm mb-3" style="border-radius:18px;">
            <div class="card-body d-flex align-items-center">

                <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
                    style="width:55px;height:55px;background:#e7ddff;color:#6f42c1;font-size:25px;">
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="flex-grow-1">
                    <h5 class="mb-1">{{ user.savedName }}</h5>
                    <div class="text-muted small">{{ user.mobile }}</div>
                    <div class="text-muted small">Language: {{ user.languageName }}</div>
                </div>

                <a href="/chat/{{ user.mobile }}" class="btn btn-success">
                    <i class="bi bi-chat-dots-fill"></i>
                </a>

            </div>
        </div>
        {% endfor %}

    </div>
    <script>

    let phoneContactSelectionRunning =
        false;

    async function selectPhoneContact() {

        if (phoneContactSelectionRunning) {
            return;
        }

        if (
            !("contacts" in navigator)
            ||
            !navigator.contacts
            ||
            typeof navigator.contacts.select
                !== "function"
        ) {

            alert(
                "Phone contact picker is supported only on compatible mobile browsers such as Android Chrome."
            );

            return;
        }

        phoneContactSelectionRunning =
            true;

        const resultBox =
            document.getElementById(
                "contactResult"
            );

        resultBox.innerHTML = `
            <div class="alert alert-info">
                Select the contacts you want to add.
            </div>
        `;

        try {

            const contacts =
                await navigator.contacts.select(
                    [
                        "name",
                        "tel"
                    ],
                    {
                        multiple:
                            true
                    }
                );

            if (
                !contacts
                ||
                contacts.length === 0
            ) {

                resultBox.innerHTML =
                    "";

                return;
            }

            const results = [];

            for (
                const contact
                of contacts
            ) {

                const name = (
                    contact.name
                    &&
                    contact.name.length
                        ? contact.name[0]
                        : ""
                );

                const mobile = (
                    contact.tel
                    &&
                    contact.tel.length
                        ? contact.tel[0]
                        : ""
                );

                if (!mobile) {
                    continue;
                }

                try {

                    const response =
                        await fetch(
                            "/check-phone-contact",
                            {
                                method:
                                    "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        name:
                                            name,

                                        mobile:
                                            mobile
                                    })
                            }
                        );

                    const data =
                        await response.json();

                    results.push({
                        name:
                            name,

                        mobile:
                            mobile,

                        success:
                            Boolean(
                                data.success
                            ),

                        message:
                            data.message
                            || "Completed"
                    });

                } catch (error) {

                    results.push({
                        name:
                            name,

                        mobile:
                            mobile,

                        success:
                            false,

                        message:
                            "Unable to add"
                    });
                }
            }

            resultBox.innerHTML =
                results.map(
                    (item) => {

                        return `
                            <div class="alert ${
                                item.success
                                    ? "alert-success"
                                    : "alert-warning"
                            } py-2 mb-2">

                                <strong>
                                    ${escapeContactHtml(
                                        item.name
                                        || item.mobile
                                    )}
                                </strong>

                                <div class="small">
                                    ${escapeContactHtml(
                                        item.message
                                    )}
                                </div>

                            </div>
                        `;

                    }
                ).join("");

            /*
            * NO automatic page reload.
            *
            * Browser contact picker will
            * therefore never appear because
            * of our own reload logic.
            */
            if (
                results.some(
                    item =>
                        item.success
                )
            ) {

                const refreshNotice =
                    document.createElement(
                        "div"
                    );

                refreshNotice.className =
                    "text-center mt-2";

                refreshNotice.innerHTML = `
                    <button type="button"
                            class="btn btn-outline-primary btn-sm"
                            onclick="window.location.reload()">

                        Refresh Contact List

                    </button>
                `;

                resultBox.appendChild(
                    refreshNotice
                );
            }

        } catch (error) {

            /*
            * User cancelled picker:
            * no alert needed.
            */
            console.log(
                "PHONE CONTACT PICKER:",
                error
            );

        } finally {

            phoneContactSelectionRunning =
                false;
        }
    }

    function escapeContactHtml(
        value
    ) {

        return String(
            value || ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );
    }

    function inviteBashaOnWhatsApp() {

        const appUrl =
            window.location.origin;

        const message =
            "Join Basha App and chat with me: "
            + appUrl;

        const whatsappUrl =
            "https://wa.me/?text="
            + encodeURIComponent(message);

        window.open(
            whatsappUrl,
            "_blank",
            "noopener,noreferrer"
        );
    }

    </script>
        
    </body>
    </html>
